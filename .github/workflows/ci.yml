name: Library Management CI/CD Workflow

on:
  push:
    branches:
      - main

jobs:
  run-and-test:
    name: Build, Run, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Python Application Script
        run: |
          echo "Executing Library Management System script..."
          python library.py

      - name: Run Automated Tests
        run: |
          echo "Running unit tests with unittest and pytest..."
          python -m unittest test_library.py

      - name: Display Workflow Execution Status
        if: always()
        run: |
          echo "=========================================================="
          echo " GitHub Actions Workflow Execution Summary"
          echo "=========================================================="
          echo " Workflow Name   : ${{ github.workflow }}"
          echo " Status          : ${{ job.status }}"
          echo " Trigger Event   : ${{ github.event_name }}"
          echo " Branch          : ${{ github.ref_name }}"
          echo " Commit Hash     : ${{ github.sha }}"
          echo " Triggered By    : ${{ github.actor }}"
          echo "=========================================================="
          if [ "${{ job.status }}" = "success" ]; then
            echo " Result: SUCCESS - All steps executed successfully!"
          else
            echo " Result: FAILURE - One or more steps failed."
          fi
